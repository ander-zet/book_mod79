plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.6'
group = 'com.example.customdiary'

repositories {
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

base {
    archivesName = 'customdiary'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.80'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'customdiary'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'customdiary'
        }
    }

    mods {
        customdiary {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Add dependencies if required
}